<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sima Apparel</title>
<style>
body{margin:0;background:#0b0b0b;color:#f5d77a;font-family:Arial,sans-serif;text-align:center}
header,section,footer{padding:24px 16px}
header{border-bottom:1px solid #8b6b24}
.hero{background:linear-gradient(135deg,#111,#33250b)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#191919;border:1px solid #8b6b24;border-radius:12px;padding:15px;color:white}
.photo{height:110px;border-radius:8px;background:#c49a35;color:#111;display:flex;align-items:center;justify-content:center;font-weight:bold}
.price{color:#f5d77a;font-weight:bold}
</style>
</head>
<body>
<header><h1>SIMA APPAREL</h1><p>Premium Clothing Collection</p></header>
<section class="hero"><h2>Style That Defines You</h2><p>Dupatta • Suits • T-Shirts • Jeans</p></section>
<section><h2>Our Collection</h2><div class="grid">
<div class="card"><div class="photo">DUPATTA</div><h3>Premium Dupatta</h3><div class="price">₹199</div></div>
<div class="card"><div class="photo">T-SHIRT</div><h3>Oversize T-Shirt</h3><div class="price">₹249</div></div>
<div class="card"><div class="photo">SUIT</div><h3>Elegant Suit</h3><div class="price">₹599</div></div>
<div class="card"><div class="photo">JEANS</div><h3>Stylish Jeans</h3><div class="price">₹699</div></div>
</div></section>
<footer>© 2026 Sima Apparel</footer>
</body>
</html>
